<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wallpaper</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ── Color palettes by time of day ─────────────────────────────────────────────

const PALETTES = {

  night: [                      // 0–5h: deep charcoal, cool stone
    [118, 115, 112],
    [108, 106, 104],
    [125, 120, 115],
    [100, 100, 102],
    [115, 112, 110],
    [105, 103, 101],
  ],

  sunrise: [                    // 5–9h: blush, peach, pale gold, warm gray
    [210, 185, 165],
    [218, 195, 170],
    [200, 172, 148],
    [195, 178, 160],
    [185, 165, 148],
    [175, 158, 142],
  ],

  day: [                        // 9–17h: sage, pale blue-gray, cool linen
    [175, 182, 172],
    [168, 178, 178],
    [180, 185, 175],
    [162, 172, 168],
    [172, 178, 170],
    [165, 175, 172],
  ],

  golden: [                     // 17–20h: amber, terracotta, warm sand
    [210, 185, 148],
    [205, 172, 138],
    [198, 168, 132],
    [215, 190, 155],
    [202, 175, 140],
    [195, 165, 130],
  ],

  dusk: [                       // 20–22h: dusty mauve, rose-gray, muted ochre
    [178, 158, 148],
    [168, 150, 142],
    [182, 162, 150],
    [160, 145, 138],
    [172, 155, 145],
    [165, 148, 140],
  ],

  evening: [                    // 22–24h: back toward charcoal, warm undertone
    [135, 128, 122],
    [128, 122, 118],
    [140, 132, 125],
    [122, 118, 115],
    [132, 126, 120],
    [125, 120, 115],
  ],

};

// ── Time of day → palette blend weights ──────────────────────────────────────

function getTimeWeights() {
  const now = new Date();
  const h = now.getHours() + now.getMinutes() / 60;

  const keyframes = [
    { h:  0,    w: { night: 1 } },
    { h:  5,    w: { night: 1 } },
    { h:  6.5,  w: { sunrise: 1 } },
    { h:  9,    w: { sunrise: 0.2, day: 0.8 } },
    { h: 11,    w: { day: 1 } },
    { h: 16,    w: { day: 1 } },
    { h: 17.5,  w: { day: 0.3, golden: 0.7 } },
    { h: 19,    w: { golden: 1 } },
    { h: 20,    w: { golden: 0.3, dusk: 0.7 } },
    { h: 21,    w: { dusk: 1 } },
    { h: 22,    w: { dusk: 0.3, evening: 0.7 } },
    { h: 23,    w: { evening: 1 } },
    { h: 24,    w: { night: 1 } },
  ];

  let lo = keyframes[0], hi = keyframes[keyframes.length - 1];
  for (let i = 0; i < keyframes.length - 1; i++) {
    if (h >= keyframes[i].h && h <= keyframes[i + 1].h) {
      lo = keyframes[i];
      hi = keyframes[i + 1];
      break;
    }
  }

  const span = hi.h - lo.h;
  const t = span === 0 ? 0 : (h - lo.h) / span;
  const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

  const keys = new Set([...Object.keys(lo.w), ...Object.keys(hi.w)]);
  const weights = {};
  keys.forEach(k => {
    const wlo = lo.w[k] || 0;
    const whi = hi.w[k] || 0;
    weights[k] = wlo + (whi - wlo) * e;
  });

  return weights;
}

function getActivePalette() {
  const weights = getTimeWeights();
  const names = Object.keys(weights);
  const NUM = 6;
  const result = [];

  for (let i = 0; i < NUM; i++) {
    let r = 0, g = 0, b = 0;
    names.forEach(name => {
      const c = PALETTES[name][i];
      const w = weights[name];
      r += c[0] * w;
      g += c[1] * w;
      b += c[2] * w;
    });
    result.push([r, g, b]);
  }
  return result;
}

// ── Lerp helpers ──────────────────────────────────────────────────────────────

function lerp(a, b, t) { return a + (b - a) * t; }

function lerpColor(c1, c2, t) {
  return [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
}

function easeInOut(t) {
  return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
}

// ── Anchor stops ──────────────────────────────────────────────────────────────

class Stop {
  constructor(index) {
    this.index = index;
    const palette = getActivePalette();
    this.current = [...palette[index]];
    this.target  = [...palette[index]];
    this.t = Math.random();
    this.speed = 0.0004 + Math.random() * 0.0006;
    this.nextResample = Date.now() + 8000 + Math.random() * 12000;
  }

  update() {
    this.t = Math.min(this.t + this.speed, 1);

    if (Date.now() > this.nextResample) {
      this.current = this._interpolated();
      this.t = 0;
      const palette = getActivePalette();
      this.target = [...palette[this.index]];
      this.nextResample = Date.now() + 8000 + Math.random() * 14000;
    }
  }

  _interpolated() {
    return lerpColor(this.current, this.target, easeInOut(this.t));
  }

  color() {
    return this._interpolated();
  }
}

// ── Anchors ───────────────────────────────────────────────────────────────────

let anchors = [];

function initAnchors() {
  anchors = [];
  const W = canvas.width, H = canvas.height;
  const cols = 3, rows = 2;
  let idx = 0;
  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      anchors.push({
        x: (col / (cols - 1)) * W,
        y: (row / (rows - 1)) * H,
        stop: new Stop(idx++),
      });
    }
  }
}
initAnchors();
window.addEventListener('resize', initAnchors);

// ── Render ────────────────────────────────────────────────────────────────────

const SAMPLE = 4;

function draw() {
  const W = canvas.width, H = canvas.height;
  const sw = Math.ceil(W / SAMPLE);
  const sh = Math.ceil(H / SAMPLE);

  anchors.forEach(a => a.stop.update());

  const imageData = ctx.createImageData(sw, sh);
  const d = imageData.data;

  for (let py = 0; py < sh; py++) {
    for (let px = 0; px < sw; px++) {
      const wx = (px / sw) * W;
      const wy = (py / sh) * H;

      let totalW = 0, r = 0, g = 0, b = 0;
      for (const a of anchors) {
        const dx = wx - a.x, dy = wy - a.y;
        const dist = Math.sqrt(dx * dx + dy * dy) + 1;
        const w = 1 / (dist * dist);
        const c = a.stop.color();
        r += c[0] * w; g += c[1] * w; b += c[2] * w;
        totalW += w;
      }
      r /= totalW; g /= totalW; b /= totalW;

      const i = (py * sw + px) * 4;
      d[i]     = Math.round(r);
      d[i + 1] = Math.round(g);
      d[i + 2] = Math.round(b);
      d[i + 3] = 255;
    }
  }

  const offscreen = document.createElement('canvas');
  offscreen.width = sw; offscreen.height = sh;
  const octx = offscreen.getContext('2d');
  octx.putImageData(imageData, 0, 0);

  ctx.save();
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(offscreen, 0, 0, W, H);
  ctx.restore();
}

function loop() {
  requestAnimationFrame(loop);
  draw();
}

loop();
</script>
</body>
</html>
