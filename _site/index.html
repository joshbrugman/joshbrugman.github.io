<body>
  <div class="site-container">
    <div id="bg" class="bg-layer"></div>
  <!-- Header -->
  <header>
    <!-- <a href="/about" class="about-toggle" title="About">?</a> -->

        <h1 class="site-title">Josh <br class="small-break"> Brugman <br class="mobile-break"></h1>
    </div>

  <!-- Background -->
    <script>

    const bg = document.getElementById('bg');

    const PALETTES = {
      night:   [[118,115,112],[108,106,104],[125,120,115],[100,100,102]],
      sunrise: [[210,185,165],[218,195,170],[200,172,148],[185,165,148]],
      day:     [[175,182,172],[168,178,178],[180,185,175],[165,175,172]],
      golden:  [[210,185,148],[205,172,138],[215,190,155],[195,165,130]],
      dusk:    [[178,158,148],[168,150,142],[182,162,150],[165,148,140]],
      evening: [[135,128,122],[128,122,118],[140,132,125],[125,120,115]],
    };

    const DRIFT_SPEED  = 0.0015;
    const RETARGET_MIN = 8000;
    const RETARGET_MAX = 20000;

    function lerp(a, b, t) { return a + (b - a) * t; }
    function ease(t) { return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2; }
    function lerpColor(a, b, t) { return a.map((v, i) => lerp(v, b[i], t)); }
    function toRgb(c) { return `rgb(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])})`; }

    function getTimeWeights() {
      const h = new Date().getHours() + new Date().getMinutes() / 60;
      const kf = [
        { h:  0,   w: { night: 1 } },
        { h:  5,   w: { night: 1 } },
        { h:  6.5, w: { sunrise: 1 } },
        { h:  9,   w: { sunrise: 0.2, day: 0.8 } },
        { h: 11,   w: { day: 1 } },
        { h: 16,   w: { day: 1 } },
        { h: 17.5, w: { day: 0.3, golden: 0.7 } },
        { h: 19,   w: { golden: 1 } },
        { h: 20,   w: { golden: 0.3, dusk: 0.7 } },
        { h: 21,   w: { dusk: 1 } },
        { h: 22,   w: { dusk: 0.3, evening: 0.7 } },
        { h: 23,   w: { evening: 1 } },
        { h: 24,   w: { night: 1 } },
      ];
      let lo = kf[0], hi = kf[kf.length - 1];
      for (let i = 0; i < kf.length - 1; i++) {
        if (h >= kf[i].h && h < kf[i+1].h) { lo = kf[i]; hi = kf[i+1]; break; }
      }
      const t = lo.h === hi.h ? 0 : (h - lo.h) / (hi.h - lo.h);
      const e = ease(t);
      const keys = new Set([...Object.keys(lo.w), ...Object.keys(hi.w)]);
      const out = {};
      keys.forEach(k => out[k] = (lo.w[k]||0) + ((hi.w[k]||0) - (lo.w[k]||0)) * e);
      return out;
    }

    function getTimedColor(i) {
      const weights = getTimeWeights();
      let r=0, g=0, b=0;
      Object.entries(weights).forEach(([name, w]) => {
        const c = PALETTES[name][i]; r += c[0]*w; g += c[1]*w; b += c[2]*w;
      });
      return [r, g, b];
    }

    function randomTimedColor(i) {
      const weights = getTimeWeights();
      const entries = Object.entries(weights);
      let roll = Math.random(), chosen = entries[0][0];
      for (const [name, w] of entries) { roll -= w; if (roll <= 0) { chosen = name; break; } }
      const base = [...PALETTES[chosen][i]];
      return base.map(v => Math.min(255, Math.max(0, v + (Math.random() - 0.5) * 18)));
    }

    const REGIONS = [
      { x: 25, y: 30 },
      { x: 75, y: 25 },
      { x: 20, y: 72 },
      { x: 78, y: 70 },
    ];

    const stops = Array.from({ length: 4 }, (_, i) => {
      const color = getTimedColor(i);
      return {
        i,
        cur: [...color],
        tgt: randomTimedColor(i),
        t: Math.random() * 0.5,
        spd: DRIFT_SPEED * (0.8 + Math.random() * 0.4),
        nextAt: Date.now() + RETARGET_MIN + Math.random() * (RETARGET_MAX - RETARGET_MIN),
        cx: REGIONS[i].x, cy: REGIONS[i].y,
        txc: REGIONS[i].x + (Math.random() - 0.5) * 20,
        tyc: REGIONS[i].y + (Math.random() - 0.5) * 20,
        pt: Math.random(),
        pspd: 0.0003 + Math.random() * 0.0003,
      };
    });

    function tick() {
      const now = Date.now();

      stops.forEach(s => {
        s.t = Math.min(s.t + s.spd, 1);
        if (s.t >= 1 || now > s.nextAt) {
          s.cur = lerpColor(s.cur, s.tgt, 1);
          s.t = 0;
          s.tgt = randomTimedColor(s.i);
          s.nextAt = now + RETARGET_MIN + Math.random() * (RETARGET_MAX - RETARGET_MIN);
        }

        s.pt = Math.min(s.pt + s.pspd, 1);
        if (s.pt >= 1) {
          s.cx = s.txc; s.cy = s.tyc;
          const region = REGIONS[s.i];
          s.txc = region.x + (Math.random() - 0.5) * 24;
          s.tyc = region.y + (Math.random() - 0.5) * 24;
          s.pt = 0;
        }
      });

      const colors = stops.map(s => lerpColor(s.cur, s.tgt, ease(s.t)));
      const positions = stops.map(s => ({
        x: lerp(s.cx, s.txc, ease(s.pt)),
        y: lerp(s.cy, s.tyc, ease(s.pt)),
      }));

      const base = toRgb(colors[0]);
      const layers = stops.map((s, i) => {
        const c = toRgb(colors[i]);
        const { x, y } = positions[i];
        return `radial-gradient(ellipse 70% 65% at ${x.toFixed(1)}% ${y.toFixed(1)}%, ${c} 0%, transparent 100%)`;
      }).join(', ');

      bg.style.background = `${layers}, ${base}`;

      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);

    </script>
